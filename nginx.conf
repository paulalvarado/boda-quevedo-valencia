server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El HTML se revalida SIEMPRE: evita servir un index.html viejo que
    # referencie assets con hash que ya no existen tras un redeploy.
    add_header Cache-Control "no-cache";

    # Assets con hash de Vite: cache largo e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta no encontrada sirve index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
